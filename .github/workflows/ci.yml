name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: pre-commit/action@v3.0.1
      - name: Data dictionary is up to date
        run: python scripts/gen_data_dictionary.py --check

  unit:
    name: Unit tests (hàm thuần, không cần bench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest
      - run: python -m pytest sp_frappe/tests/unit -q

  tests:
    name: Frappe tests (Frappe + ERPNext version-16)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FRAPPE_BRANCH: version-16
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
      - name: MariaDB charset
        run: |
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
      - name: Install bench
        run: pip install frappe-bench
      - name: Init bench and get apps
        run: |
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench --frappe-branch "$FRAPPE_BRANCH"
          cd ~/frappe-bench
          bench get-app https://github.com/frappe/erpnext --branch "$FRAPPE_BRANCH" --skip-assets
          bench get-app sp_frappe "$GITHUB_WORKSPACE" --skip-assets
      - name: Configure bench
        working-directory: /home/runner/frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:13000
      - name: Create site and install apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site test_site --db-root-password root --admin-password admin --mariadb-user-host-login-scope='%' --install-app erpnext
          bench --site test_site install-app sp_frappe
          bench --site test_site set-config allow_tests true
      - name: Migrate is idempotent
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site migrate
      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app sp_frappe
      - name: Demo data loads
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site execute sp_frappe.demo.make_demo_data
